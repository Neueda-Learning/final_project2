openapi: 3.1.0
info:
  title: Portfolio Manager API
  summary: Portfolio management REST API for stocks and ETFs
  description: |
    Manage portfolios, stock and ETF trades, daily market-data synchronization,
    portfolio valuation, and asset allocation. The MVP uses a server-side demo
    user and transmits financial values as decimal strings.
  version: 1.0.0
  contact:
    name: Portfolio Manager Team
servers:
  - url: /
    description: Current deployment; local development resolves to http://localhost:8000
security: []
tags:
  - name: Portfolios
    description: User and portfolio management
  - name: Trading
    description: Stock and ETF instruments, trades, and current positions
  - name: Market Data
    description: Daily price synchronization, run status, and latest prices
  - name: Analytics
    description: Portfolio valuation, P&L, allocation, and historical performance
  - name: Health
    description: Service liveness and dependency readiness

paths:
  /api/v1/portfolios:
    get:
      tags: [Portfolios]
      operationId: listPortfolios
      summary: List portfolios
      description: List portfolios for the current user, excluding archived portfolios by default.
      x-owner: member-2
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
          example: false
      responses:
        "200":
          description: Paginated portfolio list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioPage"
              example:
                items:
                  - id: 22222222-2222-2222-2222-222222222222
                    name: Long-term Growth
                    description: US stocks and ETFs
                    baseCurrency: USD
                    isArchived: false
                    createdAt: "2026-07-27T08:00:00Z"
                    updatedAt: "2026-07-27T08:00:00Z"
                page: 1
                pageSize: 20
                total: 1
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Portfolios]
      operationId: createPortfolio
      summary: Create a portfolio
      x-owner: member-2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioCreate"
            example:
              name: Long-term Growth
              description: US stocks and ETFs
              baseCurrency: USD
      responses:
        "201":
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
              example:
                id: 22222222-2222-2222-2222-222222222222
                name: Long-term Growth
                description: US stocks and ETFs
                baseCurrency: USD
                isArchived: false
                createdAt: "2026-07-27T08:00:00Z"
                updatedAt: "2026-07-27T08:00:00Z"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/portfolios/{portfolioId}:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
    get:
      tags: [Portfolios]
      operationId: getPortfolio
      summary: Get portfolio details
      x-owner: member-2
      responses:
        "200":
          description: Portfolio details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
              example:
                id: 22222222-2222-2222-2222-222222222222
                name: Long-term Growth
                description: US stocks and ETFs
                baseCurrency: USD
                isArchived: false
                createdAt: "2026-07-27T08:00:00Z"
                updatedAt: "2026-07-27T08:00:00Z"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags: [Portfolios]
      operationId: updatePortfolio
      summary: Update a portfolio
      x-owner: member-2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioUpdate"
            example:
              name: Core Growth
              description: Updated description
      responses:
        "200":
          description: Updated portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
              example:
                id: 22222222-2222-2222-2222-222222222222
                name: Core Growth
                description: Updated description
                baseCurrency: USD
                isArchived: false
                createdAt: "2026-07-27T08:00:00Z"
                updatedAt: "2026-07-27T09:00:00Z"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Portfolios]
      operationId: deletePortfolio
      summary: Delete an empty portfolio
      description: Only portfolios without transaction history can be deleted.
      x-owner: member-2
      responses:
        "204":
          description: Deleted successfully with no response body
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/portfolios/{portfolioId}/archive:
    post:
      tags: [Portfolios]
      operationId: archivePortfolio
      summary: Archive a portfolio
      x-owner: member-2
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
      responses:
        "200":
          description: Archived portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
              example:
                id: 22222222-2222-2222-2222-222222222222
                name: Core Growth
                description: Updated description
                baseCurrency: USD
                isArchived: true
                createdAt: "2026-07-27T08:00:00Z"
                updatedAt: "2026-07-27T10:00:00Z"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/instruments:
    get:
      tags: [Trading]
      operationId: searchInstruments
      summary: Search stocks and ETFs
      x-owner: member-3
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: AAPL
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          example: 10
      responses:
        "200":
          description: Matching stocks and ETFs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentList"
              example:
                items:
                  - id: 33333333-3333-3333-3333-333333333333
                    symbol: AAPL
                    name: Apple Inc.
                    assetType: STOCK
                    exchangeCode: NASDAQ
                    currency: USD
                    isActive: true
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/portfolios/{portfolioId}/transactions:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
    post:
      tags: [Trading]
      operationId: createTransaction
      summary: Create a purchase or sale transaction
      x-owner: member-3
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreate"
            example:
              instrumentId: 33333333-3333-3333-3333-333333333333
              side: BUY
              quantity: "10.00000000"
              tradeDate: "2026-07-27"
              unitPrice: "214.05000000"
              feeAmount: "0.00000000"
              note: Initial position
      responses:
        "201":
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
              example:
                id: 55555555-5555-5555-5555-555555555555
                portfolioId: 22222222-2222-2222-2222-222222222222
                instrumentId: 33333333-3333-3333-3333-333333333333
                symbol: AAPL
                side: BUY
                quantity: "10.00000000"
                unitPrice: "214.05000000"
                feeAmount: "0.00000000"
                currency: USD
                executedAt: "2026-07-27T16:00:00"
                note: Initial position
                createdAt: "2026-07-28T02:30:01Z"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [Trading]
      operationId: listTransactions
      summary: List transaction history
      x-owner: member-3
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: -executedAt
          example: -executedAt
      responses:
        "200":
          description: Paginated transaction list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
              example:
                items:
                  - id: 55555555-5555-5555-5555-555555555555
                    portfolioId: 22222222-2222-2222-2222-222222222222
                    instrumentId: 33333333-3333-3333-3333-333333333333
                    symbol: AAPL
                    side: BUY
                    quantity: "10.00000000"
                    unitPrice: "214.05000000"
                    feeAmount: "0.00000000"
                    currency: USD
                    executedAt: "2026-07-27T16:00:00Z"
                    note: Initial position
                    createdAt: "2026-07-28T02:30:01Z"
                page: 1
                pageSize: 20
                total: 1
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/portfolios/{portfolioId}/positions:
    get:
      tags: [Trading]
      operationId: listPositions
      summary: List current positions
      x-owner: member-3
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
      responses:
        "200":
          description: Current positions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionList"
              example:
                items:
                  - instrumentId: 33333333-3333-3333-3333-333333333333
                    symbol: AAPL
                    name: Apple Inc.
                    assetType: STOCK
                    quantity: "10.00000000"
                    averageCost: "198.54500000"
                    realizedPnl: "0.00000000"
                    openedAt: "2026-07-27T08:30:01Z"
                    updatedAt: "2026-07-27T08:30:01Z"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/market-data/sync:
    post:
      tags: [Market Data]
      operationId: triggerMarketDataSync
      summary: Trigger market-data synchronization
      x-owner: member-4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
            example:
              force: false
      responses:
        "202":
          description: Synchronization started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRun"
              example:
                id: 66666666-6666-6666-6666-666666666666
                provider: alpaca
                status: RUNNING
                stage: FETCHING_MARKET_DATA
                requestedCount: 2
                successCount: 0
                failureCount: 0
                startedAt: "2026-07-27T09:00:00Z"
                completedAt: null
                triggeredBy: MANUAL
                errorSummary: null
        "409":
          $ref: "#/components/responses/ConflictError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/v1/market-data/sync-runs/latest:
    get:
      tags: [Market Data]
      operationId: getLatestMarketDataSync
      summary: Get the latest synchronization status
      x-owner: member-4
      responses:
        "200":
          description: Latest run, or null when synchronization has never run
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SyncRun"
                  - type: "null"
              example:
                id: 66666666-6666-6666-6666-666666666666
                provider: alpaca
                status: SUCCEEDED
                stage: COMPLETED
                requestedCount: 2
                successCount: 2
                failureCount: 0
                startedAt: "2026-07-27T09:00:00Z"
                completedAt: "2026-07-27T09:00:08Z"
                triggeredBy: MANUAL
                errorSummary: null

  /api/v1/instruments/{instrumentId}/latest-price:
    get:
      tags: [Market Data]
      operationId: getLatestInstrumentPrice
      summary: Get the latest instrument price
      x-owner: member-4
      parameters:
        - $ref: "#/components/parameters/InstrumentId"
      responses:
        "200":
          description: Latest available daily close
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPrice"
              example:
                instrumentId: 33333333-3333-3333-3333-333333333333
                symbol: AAPL
                priceDate: "2026-07-24"
                closePrice: "213.55000000"
                adjustedClose: "213.55000000"
                currency: USD
                source: alpaca
                sourceTimestamp: null
                fetchedAt: "2026-07-27T09:00:05Z"
                priceStatus: FRESH
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/instruments/{instrumentId}/bars:
    get:
      tags: [Market Data]
      operationId: listInstrumentBars
      summary: List cached, paginated intraday OHLCV bars
      parameters:
        - $ref: "#/components/parameters/InstrumentId"
        - name: interval
          in: query
          schema:
            type: string
            enum: [1min, 5min, 15min, 30min]
            default: 1min
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Intraday bars in reverse chronological order
          headers:
            Cache-Control:
              schema: { type: string }
              description: Private browser cache policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketBarPage"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/instruments/{instrumentId}/tradable-prices:
    get:
      tags: [Trading, Market Data]
      operationId: listTradableInstrumentPrices
      summary: List stored daily closes
      description: >
        Returns recent real daily closing prices in descending trading-date order
        for valuation and historical inspection. Transactions select an exact
        timestamp from the intraday bars endpoint.
      x-owner: member-3
      parameters:
        - $ref: "#/components/parameters/InstrumentId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 60
          example: 60
      responses:
        "200":
          description: Recent selectable daily closing prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketPrice"
              example:
                - instrumentId: 33333333-3333-3333-3333-333333333333
                  symbol: AAPL
                  priceDate: "2026-07-27"
                  closePrice: "214.05000000"
                  adjustedClose: "214.05000000"
                  currency: USD
                  source: alpaca
                  sourceTimestamp: null
                  fetchedAt: "2026-07-28T01:00:05Z"
                  priceStatus: FRESH
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/portfolios/{portfolioId}/dashboard:
    get:
      tags: [Analytics]
      operationId: getPortfolioDashboard
      summary: Get the portfolio dashboard
      x-owner: member-5
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
      responses:
        "200":
          description: Portfolio summary, valued positions, and asset allocation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
              example:
                portfolio:
                  id: 22222222-2222-2222-2222-222222222222
                  name: Long-term Growth
                  baseCurrency: USD
                summary:
                  positionCount: 2
                  pricedPositionCount: 2
                  unpricedPositionCount: 0
                  pricedMarketValue: "125430.18000000"
                  totalCostBasis: "110000.00000030"
                  pricedCostBasis: "110000.00000030"
                  unrealizedPnl: "15430.17999970"
                  returnPct: "14.02743636"
                  newestPriceDate: "2026-07-24"
                  oldestUsedPriceDate: "2026-07-24"
                positions:
                  - instrumentId: 33333333-3333-3333-3333-333333333333
                    symbol: AAPL
                    name: Apple Inc.
                    assetType: STOCK
                    quantity: "400.00000000"
                    averageCost: "198.54500000"
                    costBasis: "79418.00000000"
                    closePrice: "213.55000000"
                    priceDate: "2026-07-24"
                    priceSource: alpaca
                    priceStatus: FRESH
                    marketValue: "85420.00000000"
                    unrealizedPnl: "6002.00000000"
                    returnPct: "7.55748067"
                    allocationPct: "68.10163232"
                  - instrumentId: 44444444-4444-4444-4444-444444444444
                    symbol: SPY
                    name: SPDR S&P 500 ETF Trust
                    assetType: ETF
                    quantity: "70.00000000"
                    averageCost: "436.88571429"
                    costBasis: "30582.00000030"
                    closePrice: "571.57400000"
                    priceDate: "2026-07-24"
                    priceSource: alpaca
                    priceStatus: FRESH
                    marketValue: "40010.18000000"
                    unrealizedPnl: "9428.17999970"
                    returnPct: "30.82918056"
                    allocationPct: "31.89836768"
                allocation:
                  - instrumentId: 33333333-3333-3333-3333-333333333333
                    symbol: AAPL
                    marketValue: "85420.00000000"
                    allocationPct: "68.10163232"
                  - instrumentId: 44444444-4444-4444-4444-444444444444
                    symbol: SPY
                    marketValue: "40010.18000000"
                    allocationPct: "31.89836768"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/portfolios/{portfolioId}/performance:
    get:
      tags: [Analytics]
      operationId: getPortfolioPerformance
      summary: Get valuation history
      x-owner: member-5
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2026-07-01"
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2026-07-27"
      responses:
        "200":
          description: Daily valuation time series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceResponse"
              example:
                portfolioId: 22222222-2222-2222-2222-222222222222
                baseCurrency: USD
                points:
                  - valuationDate: "2026-07-24"
                    pricedMarketValue: "125430.18000000"
                    totalCostBasis: "110000.00000000"
                    pricedCostBasis: "110000.00000000"
                    unrealizedPnl: "15430.18000000"
                    returnPct: "14.02743636"
                    pricedPositionCount: 2
                    unpricedPositionCount: 0
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check liveness
      x-owner: member-5
      responses:
        "200":
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveHealth"
              example:
                status: ok

  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check readiness
      x-owner: member-5
      responses:
        "200":
          description: API and MySQL are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyHealth"
              example:
                status: ready
                checks:
                  mysql: ok
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

components:
  parameters:
    PortfolioId:
      name: portfolioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 22222222-2222-2222-2222-222222222222
    InstrumentId:
      name: instrumentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 33333333-3333-3333-3333-333333333333
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Every network retry for one logical trade must reuse the same value.
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: demo-buy-aapl-001

  responses:
    NotFoundError:
      description: The resource does not exist or is outside the current user boundary
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: PORTFOLIO_NOT_FOUND
            message: Portfolio was not found.
            fieldErrors: {}
            requestId: req-01J3X6F8NQ8H2A3V
    ConflictError:
      description: Unique-key, idempotency, concurrency, or business-state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: POSITION_INSUFFICIENT_QUANTITY
            message: Sale quantity exceeds the current position.
            fieldErrors:
              quantity:
                - Must not exceed the current position.
            requestId: req-01J3X6F8NQ8H2A3V
    ValidationError:
      description: Request field validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: VALIDATION_ERROR
            message: Request validation failed.
            fieldErrors:
              quantity:
                - Must be greater than zero.
            requestId: req-01J3X6F8NQ8H2A3V
    ServiceUnavailableError:
      description: MySQL or an external dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: SERVICE_NOT_READY
            message: MySQL dependency is unavailable.
            fieldErrors: {}
            requestId: req-01J3X6F8NQ8H2A3V

  schemas:
    DecimalString:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
      example: "1250.00000000"
    Currency:
      type: string
      pattern: "^[A-Z]{3}$"
      example: USD
    AssetType:
      type: string
      enum: [STOCK, ETF]
    TradeSide:
      type: string
      enum: [BUY, SELL]
    PriceStatus:
      type: string
      enum: [FRESH, STALE, UNAVAILABLE]
    SyncStatus:
      type: string
      enum: [RUNNING, SUCCEEDED, PARTIAL, FAILED]
    SyncStage:
      type: string
      enum:
        - QUEUED
        - FETCHING_MARKET_DATA
        - REFRESHING_CURRENT_VALUATIONS
        - REBUILDING_HISTORICAL_VALUATIONS
        - COMPLETED

    ErrorResponse:
      type: object
      required: [code, message, fieldErrors, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        requestId:
          type: string

    PortfolioCreate:
      type: object
      required: [name, baseCurrency]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 500
        baseCurrency:
          $ref: "#/components/schemas/Currency"
      example:
        name: Long-term Growth
        description: US stocks and ETFs
        baseCurrency: USD

    PortfolioUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 500
      example:
        name: Core Growth
        description: Updated description

    Portfolio:
      type: object
      required:
        - id
        - name
        - baseCurrency
        - isArchived
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
