spring:
  application:
    name: portfolio-manager-api
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://8.163.83.62:10806/portfolio_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:remote_admin}
    password: ${DATABASE_PASSWORD:__FbQnbEi6hoZFfH-n6TQsrxpus}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:false}

server:
  port: ${SERVER_PORT:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  demo-user-id: ${DEMO_USER_ID:11111111-1111-1111-1111-111111111111}

market-data:
  provider: ${MARKET_DATA_PROVIDER:twelve-data}
  time-zone: ${MARKET_TIMEZONE:America/New_York}
  close-time: ${MARKET_CLOSE_TIME:16:15}
