spring:
  application:
    name: portfolio-manager-api
  jackson:
    time-zone: Asia/Shanghai
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: "${DATABASE_${DATABASE_TARGET:REMOTE}_URL:${DATABASE_URL}}"
    username: "${DATABASE_${DATABASE_TARGET:REMOTE}_USERNAME:${DATABASE_USERNAME}}"
    password: "${DATABASE_${DATABASE_TARGET:REMOTE}_PASSWORD:${DATABASE_PASSWORD}}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  cache:
    type: caffeine
    cache-names: marketBars
    caffeine:
      spec: maximumSize=500,expireAfterWrite=20s,recordStats

server:
  port: ${SERVER_PORT:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  demo-user-id: ${DEMO_USER_ID:11111111-1111-1111-1111-111111111111}

market-data:
  provider: ${MARKET_DATA_PROVIDER:alpaca}
  time-zone: ${MARKET_TIMEZONE:Asia/Shanghai}
  close-time: ${MARKET_CLOSE_TIME:16:15}
  close-time-zone: ${MARKET_CLOSE_TIMEZONE:America/New_York}

logging:
  level:
    root: INFO
    com.portfoliomanager: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
