spring:
  application:
    name: portfolio-manager-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:.env.local[.properties]
      - optional:file:../.env.local[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  cache:
    type: caffeine
    cache-names: marketBars
    caffeine:
      spec: maximumSize=500,expireAfterWrite=20s,recordStats

server:
  port: ${SERVER_PORT:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  demo-user-id: ${DEMO_USER_ID:11111111-1111-1111-1111-111111111111}

market-data:
  provider: ${MARKET_DATA_PROVIDER:twelve-data}
  time-zone: ${MARKET_TIMEZONE:America/New_York}
  close-time: ${MARKET_CLOSE_TIME:16:15}
